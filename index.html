<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Write</title>
<meta name="theme-color" content="#FFFFFF" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#09090B;
    --purple:#7C3AED;
    --faint:#C4C4C8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#FFFFFF; }
  body{
    display:flex;
    justify-content:center;
    padding:9vh 24px 12vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .field{
    position:relative;
    width:100%;
    max-width:820px;
    height:100%;
  }

  /* the visible text and the invisible input share one type ramp */
  .layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    margin:0;
    padding:0;
    font-family:Geist,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:clamp(30px, 3.6vw, 46px);
    font-weight:700;
    line-height:1.28;
    letter-spacing:-0.022em;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    word-break:break-word;
    tab-size:4;
  }

  #ink{
    color:var(--ink);
    overflow:hidden;
    pointer-events:none;
    user-select:none;
  }
  #ink .p{ color:var(--purple); }

  #t{
    background:transparent;
    color:transparent;
    caret-color:var(--ink);
    outline:0;
    resize:none;
    overflow:auto;
    scrollbar-width:none;
  }
  #t::-webkit-scrollbar{ display:none; }
  #t::placeholder{ color:var(--faint); }
  #t::selection{ background:rgba(124,58,237,.20); }

  @media (max-width:640px){
    body{ padding:6vh 20px 10vh; }
    .layer{ font-size:27px; line-height:1.3; }
  }
</style>
</head>
<body>
  <div class="field">
    <div class="layer" id="ink" aria-hidden="true"></div>
    <textarea class="layer" id="t" placeholder="Start writing" autofocus spellcheck="false" autocomplete="off" autocapitalize="sentences"></textarea>
  </div>

<script>
  const t = document.getElementById('t');
  const ink = document.getElementById('ink');
  const KEY = 'write.text';
  const PUNCT = /[.,…]/;

  function paint(){
    const v = t.value;
    let out = '';
    for (const ch of v){
      const safe = ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch;
      out += PUNCT.test(ch) ? '<span class="p">' + safe + '</span>' : safe;
    }
    ink.innerHTML = out + '\n';
    ink.scrollTop = t.scrollTop;
  }

  try { t.value = localStorage.getItem(KEY) || ''; } catch (e) {}
  paint();

  t.addEventListener('input', () => {
    paint();
    try { localStorage.setItem(KEY, t.value); } catch (e) {}
  });
  t.addEventListener('scroll', () => { ink.scrollTop = t.scrollTop; });
  window.addEventListener('resize', paint);

  t.focus();
  t.setSelectionRange(t.value.length, t.value.length);

  document.addEventListener('mousedown', e => {
    if (e.target !== t) { e.preventDefault(); t.focus(); }
  });
</script>
</body>
</html>
