<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Retainly</title>
<meta name="theme-color" content="#FFFFFF" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#09090B;
    --purple:#7C3AED;
    --line:#E4E4E7;
    --faint:#B8B8BE;
    --dot:0.235em;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; background:#FFFFFF; }
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8vh 24px 12vh;
    font-family:Geist,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ---- the logo, as the title ---- */
  .logo{
    display:inline-flex;
    align-items:baseline;
    font-size:clamp(38px, 4.6vw, 66px);
    font-weight:600;
    letter-spacing:-0.02em;
    line-height:1;
    color:var(--ink);
    user-select:none;
    white-space:nowrap;
    margin-bottom:clamp(28px, 4vh, 46px);
  }
  .logo .dot{
    display:inline-block;
    width:var(--dot);
    height:var(--dot);
    margin-left:0.085em;
    border-radius:999px;
    background:var(--purple);
    transform-origin:50% 50%;
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); }
    50%    { transform:scale(1.32); }
  }
  @media (prefers-reduced-motion:reduce){ .logo .dot{ animation:none; } }

  /* ---- the box ---- */
  .card{
    width:min(940px, 100%);
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:32px;
    padding:clamp(24px, 3vw, 38px) clamp(24px, 3.2vw, 40px);
    cursor:text;
  }

  .field{ position:relative; }

  .layer{
    display:block;
    width:100%;
    border:0;
    margin:0;
    padding:0;
    background:transparent;
    font-family:inherit;
    font-size:clamp(28px, 3.1vw, 44px);
    font-weight:700;
    line-height:1.3;
    letter-spacing:-0.022em;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    word-break:break-word;
    tab-size:4;
  }

  #ink{
    position:relative;
    min-height:2.6em;      /* two lines before it starts growing */
    color:var(--ink);
    pointer-events:none;
    user-select:none;
  }
  #ink .p{ color:var(--purple); }

  #t{
    position:absolute;
    inset:0;
    height:100%;
    color:transparent;
    caret-color:var(--ink);
    outline:0;
    resize:none;
    overflow:hidden;
  }
  #t::placeholder{ color:var(--faint); }
  #t::selection{ background:rgba(124,58,237,.20); }

  @media (max-width:640px){
    body{ padding:6vh 18px 10vh; }
    .card{ border-radius:26px; }
    .layer{ font-size:26px; }
    #ink{ min-height:2.6em; }
  }
</style>
</head>
<body>

  <div class="logo" aria-label="Retainly">Retainly<span class="dot" aria-hidden="true"></span></div>

  <div class="card" id="card">
    <div class="field">
      <div class="layer" id="ink" aria-hidden="true"></div>
      <textarea class="layer" id="t" placeholder="Start writing" autofocus spellcheck="false" autocomplete="off" autocapitalize="sentences" rows="2"></textarea>
    </div>
  </div>

<script>
  const t = document.getElementById('t');
  const ink = document.getElementById('ink');
  const KEY = 'write.text';
  const PUNCT = /[.,…]/;

  function paint(){
    let out = '';
    for (const ch of t.value){
      const safe = ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch;
      out += PUNCT.test(ch) ? '<span class="p">' + safe + '</span>' : safe;
    }
    ink.innerHTML = out + '\n';
  }

  try { t.value = localStorage.getItem(KEY) || ''; } catch (e) {}
  paint();

  t.addEventListener('input', () => {
    paint();
    try { localStorage.setItem(KEY, t.value); } catch (e) {}
  });
  window.addEventListener('resize', paint);

  t.focus();
  t.setSelectionRange(t.value.length, t.value.length);

  document.addEventListener('mousedown', e => {
    if (e.target !== t) { e.preventDefault(); t.focus(); }
  });
</script>
</body>
</html>
